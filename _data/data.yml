career-profile:
    title: Profile
    summary: |
      <p align="justify">I am an AI and Natural Language Processing researcher and technical lead, currently working at <a href="https://www.omilia.com/" target="_blank">Omilia</a> as an LLM / NLU Tech Lead. My work focuses on Large Language Models, natural language understanding, reasoning, dialogue systems, and the development of robust AI solutions for conversational applications.</p>

      <p align="justify">Previously, I co-founded <b>Lua Health</b>, a University of Galway spin-out focused on the early detection of mental health and wellbeing signals from language. As Chief Scientific Officer, I worked on applying NLP, psycholinguistics, and machine learning to identify signs of stress, anxiety, and depression and support earlier intervention.</p>

      <p align="justify">Before Lua Health, I was a Research Fellow at the <a href="https://www.universityofgalway.ie/dsi/" target="_blank">Data Science Institute</a> at the University of Galway and a member of the <a href="https://universityofgalway.ie/dsi/nlp_unit/" target="_blank">Unit for Natural Language Processing</a>. My research included neural machine translation, terminology integration, knowledge graphs, dialogue systems, and natural language generation.</p>

      <p style="margin-left:10px"><b>Research interests</b>:&nbsp;&bull;&nbsp;Natural Language Processing&nbsp;&bull;&nbsp;Large Language Models&nbsp;&bull;&nbsp;Natural Language Understanding&nbsp;&bull;&nbsp;Dialogue Systems&nbsp;&bull;&nbsp;Machine Translation </p>

