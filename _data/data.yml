career-profile:
    title: Profile
    summary: |
      <p align="justify">I build production-grade AI systems, with a focus on retrieval-augmented generation, agentic workflows, LLM evaluation, guardrails, and applied natural language processing. My work connects research depth with practical software delivery: Python and FastAPI services, vector search, PostgreSQL-backed systems, Docker-based deployment, and measurable quality controls for language-model applications. <br> <br> I was a co-founder of <a href="https://www.luahealth.io/" target="_blank">Lua Health</a>, a University of Galway spinout applying psycholinguistics and machine learning to workplace well-being, prevention, and early support. Prior to Lua, I was a research fellow at the <a href="https://www.universityofgalway.ie/dsi/" target="_blank">Data Science Institute</a> at the University of Galway, working in the <a href="https://universityofgalway.ie/dsi/nlp_unit/" target="_blank">Unit for Natural Language Processing</a> on terminology, knowledge graphs, neural machine translation, dialogue systems, and natural language generation.</p>

      <p style="margin-left:10px"><b>Focus</b>:&nbsp;&bull;&nbsp;RAG&nbsp;&bull;&nbsp;Agentic Workflows&nbsp;&bull;&nbsp;LLM Evaluation&nbsp;&bull;&nbsp;Guardrails&nbsp;&bull;&nbsp;Natural Language Processing </p>

